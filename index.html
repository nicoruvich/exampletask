<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GREEN-API: тестовая страница</title>
<style>
  :root { --bg:#f4f7f5; --fg:#16231c; --card:#fff; --line:#c5d3cb; --accent:#0a7a3d; --accent-h:#086030; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121a16; --fg:#e4efe8; --card:#1b2621; --line:#33443a; --accent:#2fb36a; --accent-h:#4cc680; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:24px 16px; display:grid; grid-template-columns:minmax(260px,380px) 1fr; gap:24px; }
  @media (max-width:720px) { .wrap { grid-template-columns:1fr; } }
  .col { display:flex; flex-direction:column; gap:10px; }
  .group { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  input, textarea, button { font:inherit; border:1px solid var(--line); border-radius:6px; padding:9px 10px; background:var(--card); color:var(--fg); width:100%; }
  textarea { min-height:80px; resize:vertical; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; font-weight:600; }
  button:hover { background:var(--accent-h); }
  button:disabled { opacity:.6; cursor:wait; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  label.out { font-style:italic; margin-bottom:6px; display:block; }
  #response { height:520px; min-height:260px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; resize:vertical; }
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <div class="group">
      <input id="idInstance" placeholder="idInstance" autocomplete="off" inputmode="numeric">
      <input id="apiToken" placeholder="ApiTokenInstance" autocomplete="off" spellcheck="false">
    </div>
    <div class="group">
      <button data-action="getSettings">getSettings</button>
      <button data-action="getStateInstance">getStateInstance</button>
    </div>
    <div class="group">
      <input id="msgPhone" placeholder="77771234567" inputmode="numeric">
      <textarea id="msgText" placeholder="Hello World!"></textarea>
      <button data-action="sendMessage">sendMessage</button>
    </div>
    <div class="group">
      <input id="filePhone" placeholder="77771234567" inputmode="numeric">
      <input id="fileUrl" placeholder="https://my.site.com/img/horse.png">
      <button data-action="sendFileByUrl">sendFileByUrl</button>
    </div>
  </div>
  <div>
    <label class="out" for="response">Ответ:</label>
    <textarea id="response" readonly></textarea>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const out = $('response');

// Номер: оставляем только цифры и добавляем суффикс @c.us
const chatId = raw => raw.replace(/\D/g, '') + '@c.us';

function show(data) {
  out.value = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
}

async function call(method, httpMethod, body) {
  const id = $('idInstance').value.trim();
  const token = $('apiToken').value.trim();
  if (!id || !token) throw new Error('Введите idInstance и ApiTokenInstance');
  const url = `https://api.green-api.com/waInstance${encodeURIComponent(id)}/${method}/${encodeURIComponent(token)}`;
  const opts = { method: httpMethod };
  if (body) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  const text = await res.text();
  try { return JSON.parse(text); } catch { return text || `HTTP ${res.status}`; }
}

const actions = {
  getSettings: () => call('getSettings', 'GET'),
  getStateInstance: () => call('getStateInstance', 'GET'),
  sendMessage: () => {
    const phone = $('msgPhone').value, message = $('msgText').value;
    if (!phone.trim() || !message.trim()) throw new Error('Укажите номер и текст сообщения');
    return call('sendMessage', 'POST', { chatId: chatId(phone), message });
  },
  sendFileByUrl: () => {
    const phone = $('filePhone').value, url = $('fileUrl').value.trim();
    if (!phone.trim() || !url) throw new Error('Укажите номер и ссылку на файл');
    const fileName = decodeURIComponent(url.split('?')[0].split('/').pop()) || 'file';
    return call('sendFileByUrl', 'POST', { chatId: chatId(phone), urlFile: url, fileName });
  }
};

document.querySelectorAll('button[data-action]').forEach(btn => {
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    show('Загрузка...');
    try {
      show(await actions[btn.dataset.action]());
    } catch (e) {
      show('Ошибка: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  });
});
</script>
</body>
</html>
